version: 1.3.13
cache: true

interface:
  customWelcome: 'Welcome to **GODMODE OS** — The Autonomous AI Engineering, Media & Intelligence Studio.'
  fileSearch: true
  modelSelect: true
  parameters: true
  presets: true
  prompts:
    use: true
    create: true
    share: true
    public: true
  bookmarks: true
  multiConvo: true
  agents: true

mcpServers:
  godmode:
    type: stdio
    command: node
    args:
      - "c:\\Users\\Dell\\Desktop\\PROjects\\Agent GODMODE\\dist\\bin\\godmode.js"
      - mcp
    timeout: 300000

endpoints:
  custom:
    - name: "GODMODE-Studio"
      apiKey: "${ANTHROPIC_API_KEY:-dummy}"
      baseURL: "https://api.anthropic.com/v1"
      models:
        default: ["claude-3-7-sonnet-20250219"]
        fetch: false
      titleConvo: true
      titleModel: "claude-3-7-sonnet-20250219"
